<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#122A28" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Koko — Histoires Bilingues & Apprentissage de l'Anglais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper text-ink selection:bg-gold/20 antialiased overscroll-none">
    <div id="root"></div>
    <script>
      (function() {
        window.addEventListener('error', function (e) {
          var targetSrc = (e.target && e.target.src) || '';
          var msg = (e.message || '').toLowerCase();
          var isModuleError = msg.indexOf('mime') !== -1 || msg.indexOf('module') !== -1 || msg.indexOf('loading chunk') !== -1;
          var isScriptTarget = e.target && e.target.tagName === 'SCRIPT';
          if (isModuleError || (isScriptTarget && targetSrc.indexOf('/assets/') !== -1)) {
            var lastReload = sessionStorage.getItem('koko_reload_ts');
            var now = Date.now();
            if (!lastReload || (now - parseInt(lastReload, 10)) > 8000) {
              sessionStorage.setItem('koko_reload_ts', now.toString());
              window.location.reload(true);
            }
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
